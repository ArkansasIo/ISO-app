services:
  api:
    build: ./api
    environment:
      NODE_ENV: development
      PORT: 8080
      DATABASE_URL: mysql://ide:ide_dev_only@mysql:3306/github_universal_ide
      CRON_ENABLED: "true"
      CRON_TIMEZONE: America/Toronto
      CORS_ORIGIN: http://localhost:8080
      APP_ENCRYPTION_KEY: development-only-change-me-32-bytes
      WORKER_URL: http://worker:8090
      WORKER_SHARED_SECRET: local-worker-secret
    ports: ["8080:8080"]
    depends_on:
      mysql:
        condition: service_healthy
      worker:
        condition: service_started
  worker:
    build: ./worker
    environment:
      PORT: 8090
      WORKER_SHARED_SECRET: local-worker-secret
    expose: ["8090"]
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: github_universal_ide
      MYSQL_USER: ide
      MYSQL_PASSWORD: ide_dev_only
      MYSQL_ROOT_PASSWORD: root_dev_only
    ports: ["3306:3306"]
    volumes:
      - ide_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u ide -pide_dev_only --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  ide_mysql_data:
