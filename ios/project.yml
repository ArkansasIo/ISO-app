name: GitHubUniversalIDE
options:
  bundleIdPrefix: io.arkansasio
  deploymentTarget:
    iOS: "17.0"
targets:
  GitHubUniversalIDE:
    type: application
    platform: iOS
    sources:
      - path: GitHubUniversalIDE
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.arkansasio.githubuniversalide
        PRODUCT_NAME: GitHub Universal IDE
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
